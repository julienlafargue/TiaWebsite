<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Series — TIA-LANA</title>
  <meta name="description" content="A series by Tia-Lana Chinapyel. Browse the frames, click one to open it full screen." />
  <meta name="theme-color" content="#f2efe9" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css?v=12" />
  <link rel="stylesheet" href="css/tokens.css?v=15" />
  <link rel="stylesheet" href="css/typography.css?v=13" />
  <link rel="stylesheet" href="css/styles.css?v=49" />
</head>
<body class="page-series">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav nav--on-light">
    <nav class="nav__links nav__links--left" aria-label="Primary">
      <a href="work.html" aria-current="page" data-i18n="nav.work">Portfolio</a>
      <a href="about.html" data-i18n="nav.about">About</a>
    </nav>
    <a class="nav__logo" href="index.html">Tia-Lana</a>
    <nav class="nav__links nav__links--right">
      <a href="services.html" data-i18n="nav.booking">Services</a>
      <button class="nav__lang" data-lang-toggle aria-label="Switch language">FR</button>
    </nav>
    <button class="nav__burger" aria-expanded="false" aria-controls="nav-menu" data-i18n="nav.menu">Menu</button>
    <div class="nav__menu" id="nav-menu">
      <a href="work.html" data-i18n="nav.work">Portfolio</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="services.html" data-i18n="nav.booking">Services</a>
      <button class="nav__lang" data-lang-toggle aria-label="Switch language">FR</button>
    </div>
  </header>

  <main id="main" class="section section--light">
    <div class="wrap">
      <div class="series-head">
        <a class="series-head__back link-arrow" href="work.html"><span>←</span> <span data-i18n="series.back">All series</span></a>
        <div class="stack" style="text-align:right">
          <h1 class="series-head__title" data-series-title>Series</h1>
          <p class="series-head__sub" data-series-meta></p>
        </div>
      </div>

      <p class="series-head__intro" data-series-intro></p>

      <!-- galerie asymétrique peuplée par js/series.js -->
      <div class="gallery" data-gallery aria-label="Photographs — click to enlarge"></div>
    </div>
  </main>

  <!-- lightbox -->
  <div class="lightbox" data-lightbox role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lightbox__bar wrap">
      <span class="lightbox__count" data-lb-count>01 / 01</span>
      <button class="lightbox__close" data-lb-close type="button"><span data-i18n="series.close">Close</span> ✕</button>
    </div>
    <div class="lightbox__stage">
      <button class="lightbox__nav lightbox__prev" data-lb-prev type="button" aria-label="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <img class="lightbox__img" data-lb-img alt="" />
      <button class="lightbox__nav lightbox__next" data-lb-next type="button" aria-label="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="lightbox__cap">
      <p class="lightbox__title" data-lb-title></p>
      <p class="lightbox__desc" data-lb-desc></p>
    </div>
  </div>

  <footer class="footer">
    <div class="wrap footer__row">
      <p class="footer__brand" data-i18n="footer.brand">TIA-LANA — PARIS</p>
      <p class="footer__meta label" data-i18n="footer.role">PHOTOGRAPHY · ART DIRECTION</p>
    </div>
  </footer>

  <script type="module" src="js/i18n.js?v=13"></script>
  <script type="module" src="js/main.js?v=12"></script>
  <script type="module" src="js/cursor.js?v=12"></script>
  <script type="module" src="js/transitions.js?v=12"></script>
  <script type="module" src="js/series.js?v=7"></script>
</body>
</html>
